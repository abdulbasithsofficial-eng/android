services:
  - type: web
    name: basixa-video-agent-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 1800 --workers 1 --threads 2
    envVars:
      - key: BYPASS_LICENSE
        value: "true"
      - key: RENDER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Enter your Gemini API Key"
      - key: PEXELS_API_KEY
        sync: false
        placeholder: "Enter your Pexels API Key"
